services:
  - type: web
    name: telegram-group-manager
    env: python
    plan: free

    buildCommand: "pip3 install --no-cache-dir --upgrade --requirement requirements.txt"
    startCommand: "bash start"

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: OWNER_ID
        sync: false

      - key: OWNER_USERNAME
        sync: false

      - key: PYTHON_VERSION
        value: 3.11.4
     
      - key: PORT
        value: "10000"

